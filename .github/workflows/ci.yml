name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - timezone: UTC
            artifact: utc
          - timezone: Asia/Shanghai
            artifact: shanghai
          - timezone: Australia/Sydney
            artifact: sydney
          - timezone: America/Los_Angeles
            artifact: los-angeles
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/vitest
          npm test 2>&1 | tee test-results/vitest/output.log
      - run: npm run build
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ matrix.artifact }}
          path: test-results/vitest/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install WebKit and system dependencies
        id: webkit
        continue-on-error: true
        run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Enforce production bundle budget
        run: npm run size
      - run: npx playwright test
        env:
          PLAYWRIGHT_WEBKIT: ${{ steps.webkit.outcome == 'success' && '1' || '0' }}
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
