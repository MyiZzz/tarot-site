name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - timezone: UTC
            artifact: utc
          - timezone: Asia/Shanghai
            artifact: shanghai
          - timezone: Australia/Sydney
            artifact: sydney
          - timezone: America/Los_Angeles
            artifact: los-angeles
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/vitest
          npm test 2>&1 | tee test-results/vitest/output.log
      - run: npm run build
      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ matrix.artifact }}
          path: test-results/vitest/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Visual baselines are generated in this exact image (fonts, browsers and
    # system libs pinned). Keep the tag in sync with @playwright/test and
    # regenerate snapshots inside it: see tests/e2e/README.md.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      TZ: Asia/Shanghai
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce production bundle budget
        run: npm run size
      - run: npx playwright test
        env:
          PLAYWRIGHT_WEBKIT: '1'
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
